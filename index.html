<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ashish Kumar | Plasma Physics & Environmental Engineering Researcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Source+Serif+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ... (keep all existing styles) ... */
        
        /* Added small improvements */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Improved mobile nav */
        .nav-links.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }
        .toast-success { background: #27ae60; }
        .toast-error { background: #e74c3c; }
        .toast-info { background: #3498db; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- ... (keep all existing HTML structure) ... -->
    
    <!-- Add toast container -->
    <div id="toastContainer"></div>

    <script>
        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================
        // IMPROVED CV DOWNLOAD
        // ============================================
        document.getElementById('downloadCVBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            showToast('📄 Opening CV...', 'info');
            
            // Open CV in new tab - replace with actual PDF URL
            // window.open('path/to/your/cv.pdf', '_blank');
            
            // Or generate a simple CV
            const cvContent = `
                <html>
                <head>
                    <title>Ashish Kumar - CV</title>
                    <style>
                        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
                        h1 { color: #1a4b6e; border-bottom: 3px solid #e67e22; padding-bottom: 10px; }
                        h2 { color: #2c7da0; margin-top: 25px; }
                        .section { margin-bottom: 30px; }
                        .item { margin-bottom: 15px; }
                        .date { color: #666; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h1>Ashish Kumar</h1>
                    <p><strong>PhD Researcher in Plasma Physics</strong><br>
                    Comenius University Bratislava<br>
                    Email: kumar18@uniba.sk</p>
                    
                    <div class="section">
                        <h2>Education</h2>
                        <div class="item">
                            <span class="date">2024 – Present</span><br>
                            <strong>PhD in Plasma Physics</strong><br>
                            Comenius University Bratislava
                        </div>
                        <div class="item">
                            <span class="date">2021 – 2023</span><br>
                            <strong>M.Tech in Infrastructure Engineering (Environmental Engineering)</strong><br>
                            IIT Jodhpur
                        </div>
                        <div class="item">
                            <span class="date">2015 – 2019</span><br>
                            <strong>B.Tech in Civil Engineering</strong><br>
                            Dr. A.P.J. Abdul Kalam Technical University
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2>Research Experience</h2>
                        <div class="item">
                            <strong>Ion Mobility Spectrometry</strong><br>
                            Development of drift tube IMS for VOC detection
                        </div>
                        <div class="item">
                            <strong>Air Quality Monitoring</strong><br>
                            PM2.5 carbonaceous aerosol studies over semi-arid regions
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2>Publications</h2>
                        <div class="item">
                            • Stabilization of Soil of Hilly Region Using Fly Ash With Various Additives (2025)<br>
                            • Estimation of Soaked California Bearing Ratio of Soil Using Machine Learning (2025)
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2>Selected Talks</h2>
                        <div class="item">
                            • Week of Doctoral Students 2026, Charles University, Prague<br>
                            • 40th PSSI National Symposium, IIT Tirupati (2025)
                        </div>
                    </div>
                    
                    <div style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #eee; text-align: center; color: #666;">
                        <p>Generated: ${new Date().toLocaleDateString()}</p>
                    </div>
                </body>
                </html>
            `;
            
            const blob = new Blob([cvContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        // ============================================
        // IMPROVED PAGE NAVIGATION WITH ANIMATION
        // ============================================
        function showPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page-section').forEach(el => {
                el.classList.remove('active-page');
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
            });
            
            // Show target page
            const target = document.getElementById(`${pageId}-page`);
            if (target) {
                target.classList.add('active-page');
                setTimeout(() => {
                    target.style.opacity = '1';
                    target.style.transform = 'translateY(0)';
                    target.style.transition = 'all 0.3s ease';
                }, 50);
            }
            
            // Update navigation
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === pageId) {
                    link.classList.add('active');
                }
            });
            
            // Close mobile menu
            document.getElementById('navLinks').classList.remove('active');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================
        // CONTACT FORM WITH BETTER HANDLING
        // ============================================
        const contactForm = document.getElementById('contactForm');
        const formStatus = document.getElementById('formStatus');

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!name || !email || !subject || !message) {
                formStatus.innerHTML = '⚠️ Please fill in all fields.';
                formStatus.style.color = '#e74c3c';
                return;
            }
            
            // Show loading state
            const submitBtn = contactForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Sending...';
            submitBtn.disabled = true;
            
            // Simulate sending (replace with actual EmailJS)
            setTimeout(() => {
                formStatus.innerHTML = '✅ Message sent successfully! I\'ll get back to you soon.';
                formStatus.style.color = '#27ae60';
                contactForm.reset();
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                showToast('✅ Message sent successfully!', 'success');
            }, 1500);
            
            // ===== UNCOMMENT FOR REAL EMAILJS =====
            /*
            emailjs.init("YOUR_PUBLIC_KEY");
            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                from_name: name,
                from_email: email,
                subject: subject,
                message: message,
            }).then(() => {
                formStatus.innerHTML = '✅ Message sent successfully! I\'ll get back to you soon.';
                formStatus.style.color = '#27ae60';
                contactForm.reset();
                showToast('✅ Message sent successfully!', 'success');
            }).catch((error) => {
                formStatus.innerHTML = '❌ Error sending message. Please try again or email me directly.';
                formStatus.style.color = '#e74c3c';
                showToast('❌ Failed to send message', 'error');
                console.error('EmailJS error:', error);
            }).finally(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
            */
        });

        // ============================================
        // IMPROVED IMAGE GALLERY
        // ============================================
        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            if (!container) return;
            
            if (imageStore.length === 0) {
                container.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding: 3rem; color: var(--text-muted);">
                        <i class="fas fa-images" style="font-size: 4rem; opacity: 0.3; display:block; margin-bottom: 1rem;"></i>
                        <p style="font-size: 1.1rem;">No images yet. Upload your research photos, conference pictures, or lab setups.</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Drag & drop or click the upload area above.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            imageStore.forEach((img, idx) => {
                html += `
                    <div class="gallery-item" data-index="${idx}" style="animation: fadeUp 0.4s ease ${idx * 0.05}s both;">
                        <img src="${img.dataUrl}" alt="${img.name}" loading="lazy">
                        <div class="gallery-caption">
                            <span><i class="far fa-image"></i> ${img.name}</span>
                            <button class="delete-img-btn" data-idx="${idx}" aria-label="Delete image">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            
            // Delete handlers
            document.querySelectorAll('.delete-img-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.getAttribute('data-idx'));
                    if (confirm('Delete this image?')) {
                        imageStore.splice(idx, 1);
                        saveGallery();
                        showToast('🗑️ Image deleted', 'info');
                    }
                });
            });
            
            // Click to enlarge
            document.querySelectorAll('.gallery-item img').forEach(img => {
                img.addEventListener('click', () => {
                    const modalImg = document.getElementById('modalImg');
                    modalImg.src = img.src;
                    document.getElementById('imageModal').style.display = 'flex';
                });
            });
        }

        // ============================================
        // BETTER MOBILE MENU
        // ============================================
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            icon.className = navLinks.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.navbar') && navLinks.classList.contains('active')) {
                navLinks.classList.remove('active');
                menuToggle.querySelector('i').className = 'fas fa-bars';
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            // Ctrl+1-9 to navigate pages
            if (e.ctrlKey && e.key >= '1' && e.key <= '9') {
                e.preventDefault();
                const index = parseInt(e.key) - 1;
                const pages = ['home', 'about', 'research', 'publications', 'talks', 'gallery', 'blog', 'experience', 'contact'];
                if (pages[index]) showPage(pages[index]);
            }
            
            // Escape to close modals
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.style.display = 'none';
                });
            }
        });

        // ============================================
        // PROGRESS INDICATOR FOR SCROLLING
        // ============================================
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = (scrollTop / docHeight) * 100;
            
            // Update progress bar if you want to add one
            // document.getElementById('progressBar')?.style.setProperty('width', progress + '%');
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        showPage('home');
        renderGallery();

        console.log('🚀 Ashish Kumar Portfolio loaded successfully!');
        console.log('📧 For issues, contact: kumar18@uniba.sk');
        console.log('🌙 Press Ctrl+1-9 for quick navigation');
    </script>
</body>
</html>
